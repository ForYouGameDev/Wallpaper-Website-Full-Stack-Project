<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5b3fe8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Frameshift — wallpapers for every screen</title>
    <meta name="description" content="Free and premium phone and desktop wallpapers: anime, nature, cars, gaming, AMOLED, space and more." />
    <script>
      // TEMP DEBUG: shows any startup error on the page. Remove after fixing.
      (function () {
        function show(msg) {
          var p = document.createElement('pre');
          p.style.cssText = 'color:#b00020;background:#fff;padding:16px;white-space:pre-wrap;font:14px monospace;position:fixed;top:0;left:0;right:0;z-index:99999';
          p.textContent = msg;
          (document.body || document.documentElement).appendChild(p);
        }
        window.addEventListener('error', function (e) {
          var t = e.target && e.target !== window && (e.target.src || e.target.href);
          show(t ? 'Failed to load: ' + t : 'ERROR: ' + e.message + ' @ ' + e.filename + ':' + e.lineno);
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          show('PROMISE ERROR: ' + ((e.reason && e.reason.message) || e.reason));
        });
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Apply theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('theme');
        var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
